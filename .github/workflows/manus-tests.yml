name: Manus task checks
on:
  push:
    branches: [ManusIntegration, main]
    paths: ['supabase/**', 'NOVA_FE/**', '.github/workflows/manus-tests.yml']
  pull_request:
    paths: ['supabase/**', 'NOVA_FE/**', '.github/workflows/manus-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno test --allow-read --allow-env --allow-sys --config supabase/functions/deno.json supabase/tests/delegation
      - run: deno check --config supabase/functions/deno.json supabase/functions/tasks/index.ts supabase/functions/task-worker/index.ts supabase/functions/task-webhook/index.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: NOVA_FE/package-lock.json
      - run: npm ci && npm run build
        working-directory: NOVA_FE
# No deployment steps or production secrets. Release is a separate explicit operation.
