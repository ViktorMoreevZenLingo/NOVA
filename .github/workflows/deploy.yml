name: Deploy Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/**", "NOVA_VOICE/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Unit tests (phone assistant)
        working-directory: NOVA_VOICE
        run: deno task test

      - name: Unit tests (delegated tasks)
        run: deno test --allow-read --allow-env --allow-sys --config supabase/functions/deno.json supabase/tests/delegation

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # One shared migration history (Alo + phone assistant). Our first two
      # migrations were applied outside it earlier; marking them is idempotent.
      - name: Apply migrations
        run: |
          supabase migration repair --status applied 20261010000001 20261010000002 --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Set function secrets and Vault config
        env:
          # Phone assistant
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          VAPI_TOOL_SECRET: ${{ secrets.VAPI_TOOL_SECRET }}
          TEST_USER_PIN: ${{ secrets.TEST_USER_PIN }}
          DEMO_WEBCALL_PHONE: ${{ vars.DEMO_WEBCALL_PHONE }}
          # Alo app (empty values are skipped, so secrets set by hand are kept)
          APP_URL: ${{ vars.APP_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          APP_TIMEZONE: ${{ vars.APP_TIMEZONE }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          set -euo pipefail
          project_url="https://${PROJECT_REF}.supabase.co"
          # Rotated on every deploy; written to both the function env and Vault (used by pg_cron).
          cron_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$cron_secret"

          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          {
            echo "MANUS_WEBHOOK_URL=${project_url}/functions/v1/manus-webhook"
            echo "CRON_SECRET=${cron_secret}"
            for name in MANUS_API_KEY VAPI_TOOL_SECRET TEST_USER_PIN DEMO_WEBCALL_PHONE \
                        APP_URL OPENAI_API_KEY OPENAI_MODEL APP_TIMEZONE GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                        MICROSOFT_CLIENT_ID MICROSOFT_CLIENT_SECRET GOOGLE_PLACES_API_KEY; do
              value="${!name:-}"
              if [ -n "$value" ]; then echo "${name}=${value}"; else echo "::notice::${name} not in GitHub; keeping the value in Supabase (if any)" >&2; fi
            done
          } > "$env_file"
          supabase secrets set --project-ref "$PROJECT_REF" --env-file "$env_file"

          # Vault secrets for the reconcile cron job (Management API, parameterized query).
          for pair in "project_url|${project_url}" "cron_secret|${cron_secret}"; do
            jq -n --arg n "${pair%%|*}" --arg v "${pair#*|}" \
              '{query: "select public.nova_set_vault_secret($1, $2)", parameters: [$n, $v]}' |
              curl -sSf -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
                -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" \
                --data-binary @- > /dev/null
          done

      - name: Deploy functions
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api

      - name: Register Manus webhook (idempotent)
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
        run: |
          if [ -z "$MANUS_API_KEY" ]; then echo "::warning::MANUS_API_KEY not set; skipping"; exit 0; fi
          MANUS_WEBHOOK_URL="https://${PROJECT_REF}.supabase.co/functions/v1/manus-webhook" \
            deno run --allow-env --allow-net=api.manus.ai NOVA_VOICE/scripts/register-manus-webhook.ts

      - name: Smoke check
        run: |
          # Unauthenticated calls must be rejected by our own auth (proves the functions boot).
          base="https://${PROJECT_REF}.supabase.co/functions/v1"
          for fn in voice-tools create-task get-task-status reconcile manus-webhook voice-approve agent integrations account-delete; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/$fn")
            echo "$fn -> $code"
          done
