spring.application.name=alo-backend
server.port=8080

# Load secrets from a git-ignored file at the project root, if present.
# Values there (and real environment variables) override the defaults below.
spring.config.import=optional:file:./application-local.properties

# H2 in file mode so data survives restarts during the demo.
spring.datasource.url=jdbc:h2:file:./data/alo;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console at http://localhost:8080/h2-console (handy for the demo).
spring.h2.console.enabled=true

# Sessions: standard HttpSession (JSESSIONID cookie), no persistence needed.
server.servlet.session.timeout=7d

# --- Config via environment variables ---
# Empty defaults so the app still boots from an IDE without env vars set;
# Google OAuth won't work until these are provided (a warning is logged).
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
# The URL the browser uses (localhost:3000 in dev, or the ngrok URL).
app.public-url=${PUBLIC_URL:http://localhost:3000}

# Timezone used when creating calendar events and interpreting "today/tomorrow".
app.timezone=${APP_TIMEZONE:Europe/Sofia}

# --- OpenAI (the agent's brain) ---
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
